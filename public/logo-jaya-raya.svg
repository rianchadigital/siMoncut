<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- Filter for clean edge rendering -->
    <filter id="crisp">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Golden Yellow Outer Shield Border (with distinctive top flared corners) -->
  <path 
    d="M 10 10 L 190 10 L 198 28 L 180 28 L 180 162 L 100 226 L 20 162 L 20 28 L 2 28 Z" 
    fill="#ffc800" 
    stroke="#d89600" 
    stroke-width="1.5" 
  />

  <!-- Inner Shield Area -->
  <!-- Top White Bar for Text "JAYA RAYA" -->
  <path 
    d="M 22 14 L 178 14 L 178 68 L 22 68 Z" 
    fill="#ffffff" 
  />

  <!-- Red Text: JAYA RAYA -->
  <text 
    x="100" 
    y="46" 
    text-anchor="middle" 
    fill="#dc143c" 
    font-family="'Times New Roman', Times, 'DejaVu Serif', serif" 
    font-weight="900" 
    font-size="20" 
    letter-spacing="5"
  >
    JAYA RAYA
  </text>

  <!-- Stepped Arch Blue Field (Royal Blue) -->
  <path 
    d="M 22 68 L 42 68 L 42 54 L 64 54 L 64 38 L 100 26 L 136 38 L 136 54 L 158 54 L 158 68 L 178 68 L 178 158 L 100 220 L 22 158 Z" 
    fill="#0450a1" 
    stroke="#ffc800" 
    stroke-width="2" 
  />

  <!-- Rice Stalk (Padi Emas - Sisi Kiri) -->
  <g fill="#ffc800" stroke="#b87800" stroke-width="0.7">
    <!-- Curved stalk stem -->
    <path d="M 28 154 Q 22 108 64 68" fill="none" stroke="#ffc800" stroke-width="2.5" />
    
    <!-- Rice grains along the stalk -->
    <ellipse cx="64" cy="68" rx="4" ry="7" transform="rotate(35 64 68)" />
    <ellipse cx="58" cy="74" rx="4" ry="7" transform="rotate(25 58 74)" />
    <ellipse cx="52" cy="82" rx="4" ry="7" transform="rotate(15 52 82)" />
    <ellipse cx="46" cy="92" rx="4" ry="7" transform="rotate(5 46 92)" />
    <ellipse cx="42" cy="104" rx="4" ry="7" transform="rotate(-10 42 104)" />
    <ellipse cx="38" cy="116" rx="4" ry="7" transform="rotate(-25 38 116)" />
    <ellipse cx="36" cy="128" rx="4" ry="7" transform="rotate(-40 36 128)" />
    <ellipse cx="35" cy="140" rx="4" ry="7" transform="rotate(-55 35 140)" />
    <ellipse cx="38" cy="152" rx="4" ry="7" transform="rotate(-70 38 152)" />

    <!-- Inner row grains -->
    <ellipse cx="60" cy="80" rx="3.5" ry="6.5" transform="rotate(20 60 80)" />
    <ellipse cx="54" cy="90" rx="3.5" ry="6.5" transform="rotate(10 54 90)" />
    <ellipse cx="48" cy="102" rx="3.5" ry="6.5" transform="rotate(-5 48 102)" />
    <ellipse cx="44" cy="114" rx="3.5" ry="6.5" transform="rotate(-20 44 114)" />
    <ellipse cx="42" cy="126" rx="3.5" ry="6.5" transform="rotate(-35 42 126)" />
    <ellipse cx="42" cy="138" rx="3.5" ry="6.5" transform="rotate(-50 42 138)" />
  </g>

  <!-- Cotton Stalk (Kapas Putih & Daun Hijau - Sisi Kanan) -->
  <g>
    <!-- Green stem -->
    <path d="M 172 154 Q 178 108 136 68" fill="none" stroke="#00923f" stroke-width="2.5" />
    
    <!-- Green leaves -->
    <g fill="#00923f">
      <path d="M 140 76 Q 148 72 144 82 Z" />
      <path d="M 146 92 Q 156 88 150 98 Z" />
      <path d="M 152 108 Q 162 104 156 114 Z" />
      <path d="M 156 124 Q 166 120 160 130 Z" />
      <path d="M 158 140 Q 168 136 162 146 Z" />
    </g>

    <!-- White fluffy cotton bolls -->
    <g fill="#ffffff" stroke="#90a4ae" stroke-width="0.8">
      <!-- Boll 1 -->
      <circle cx="134" cy="72" r="5" />
      <!-- Boll 2 -->
      <circle cx="148" cy="78" r="5.5" />
      <!-- Boll 3 -->
      <circle cx="142" cy="90" r="5.5" />
      <!-- Boll 4 -->
      <circle cx="156" cy="98" r="5.5" />
      <!-- Boll 5 -->
      <circle cx="150" cy="112" r="6" />
      <!-- Boll 6 -->
      <circle cx="162" cy="122" r="6" />
      <!-- Boll 7 -->
      <circle cx="156" cy="138" r="6" />
      <!-- Boll 8 -->
      <circle cx="166" cy="148" r="5.5" />
    </g>
  </g>

  <!-- Monumen Nasional (Monas) -->
  <g id="monas-center">
    <!-- Lower terraces / gate plinth (white) -->
    <polygon points="76,160 124,160 122,152 78,152" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
    <!-- Two side pavilions -->
    <rect x="72" y="150" width="14" height="8" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
    <rect x="114" y="150" width="14" height="8" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
    <!-- Upper terrace -->
    <polygon points="82,152 118,152 116,144 84,144" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Cawan Monas (tiered cup base) -->
    <polygon points="78,144 122,144 116,134 84,134" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" />
    
    <!-- Monas Obelisk Shaft -->
    <polygon points="96,134 104,134 102,62 98,62" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <!-- Shaft 3D shadow line -->
    <line x1="100" y1="62" x2="100" y2="134" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Puncak Platform & Cawan Api -->
    <polygon points="95,62 105,62 104,58 96,58" fill="#ffffff" stroke="#94a3b8" stroke-width="0.6" />
    <polygon points="93,58 107,58 106,55 94,55" fill="#ffc800" stroke="#d89600" stroke-width="0.5" />

    <!-- Lidah Api Kemerdekaan (Red Flame with White core) -->
    <path d="M 100 36 C 95 44 95 48 97 55 L 103 55 C 105 48 105 44 100 36 Z" fill="#e31818" />
    <path d="M 100 40 C 97 45 98 49 99 55 L 101 55 C 102 49 103 45 100 40 Z" fill="#ffffff" />
  </g>

  <!-- Yellow Ribbon Bow Knot (Simpul Pita Pengikat Padi & Kapas) -->
  <g id="pita-knot" fill="#ffc800" stroke="#b87800" stroke-width="1.2">
    <!-- Center knot circle -->
    <circle cx="100" cy="172" r="5" />
    <!-- Left loop of bow -->
    <ellipse cx="91" cy="172" rx="6" ry="4" transform="rotate(-15 91 172)" />
    <!-- Right loop of bow -->
    <ellipse cx="109" cy="172" rx="6" ry="4" transform="rotate(15 109 172)" />
    <!-- Left hanging ribbon tail -->
    <path d="M 96 175 Q 86 186 82 194" fill="none" stroke="#ffc800" stroke-width="3" stroke-linecap="round" />
    <!-- Right hanging ribbon tail -->
    <path d="M 104 175 Q 114 186 118 194" fill="none" stroke="#ffc800" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- White Wave Lines (Ombak Laut Jakarta & Kepulauan Seribu) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <!-- Wave 1 (Upper wave) -->
    <path d="M 70 196 Q 85 188 100 196 Q 115 204 130 196" />
    <!-- Wave 2 (Lower wave) -->
    <path d="M 78 206 Q 89 200 100 206 Q 111 212 122 206" />
  </g>
</svg>
